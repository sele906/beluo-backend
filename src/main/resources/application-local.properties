# MongoDB Connection
spring.data.mongodb.uri=mongodb://localhost:27017/beluo_test
spring.data.mongodb.database=beluo_test

# monitoring
management.metrics.tags.application=beluo
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.tomcat.mbeanregistry.enabled=true

# rabbitmq
spring.rabbitmq.addresses=${RABBITMQ_URL}

# fcm
fcm.mock.enabled=true
fcm.mock.delay-ms=100