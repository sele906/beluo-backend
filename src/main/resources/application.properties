spring.application.name=beluo
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILE}

server.port=${PORT:8080}
server.address=0.0.0.0

# Prompt Files
prompt.character=${PROMPT_CHARACTER}
prompt.summary=${PROMPT_SUMMARY}
prompt.summary-short=${PROMPT_SUMMARY_SHORT}
prompt.system=${PROMPT_SYSTEM}

# Cookie
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

server.forward-headers-strategy=framework

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# File
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL
app.frontend-url=${APP_FRONTEND_URL}

# OpenAI API Key
openai.api.key=${OPENAI_API_KEY}

# OpenRouter API Key
openrouter.api.key=${OPENROUTER_API_KEY}

# Claude API Key
claude.api.key=${CLAUDE_API_KEY}

# Groq API Key
groq.api.key=${GROQ_API_KEY}

# Polar API Key
polar.access-token=${POLAR_ACCESS_TOKEN}
polar.base-url=${POLAR_BASE_URL}
polar.success-url=${POLAR_SUCCESS_URL}
polar.webhook-secret=${POLAR_WEBHOOK_SECRET}
polar.product.credit-100-id=${POLAR_PRODUCT_CREDIT_100_ID}
polar.product.credit-350-id=${POLAR_PRODUCT_CREDIT_350_ID}
polar.product.credit-650-id=${POLAR_PRODUCT_CREDIT_650_ID}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access.token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh.token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# Redirect URL
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Debug
logging.level.org.springframework.security=DEBUG

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false